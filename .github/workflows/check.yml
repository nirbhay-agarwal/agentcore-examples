name: Basic Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Check for secrets in code
        run: |
          # Fail if any .env files are committed
          if git ls-files | grep -q "\.env$"; then
            echo "❌ .env file found in repo! Remove it immediately."
            exit 1
          else
            echo "✅ No .env files found"
          fi
      
      - name: Check for AWS keys in code
        run: |
          # Fail if any AWS keys are hardcoded
          if grep -r "AKIA" --include="*.py" .; then
            echo "❌ Possible AWS key found in code!"
            exit 1
          else
            echo "✅ No hardcoded AWS keys found"
          fi
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r browser-agent/requirements.txt
      
      - name: Check Python syntax
        run: |
          python -m py_compile browser-agent/agent.py
          python -m py_compile browser-agent/run_agent.py
          python -m py_compile browser-agent/streamlit_app.py
          echo "✅ All Python files are valid"